<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 792 800" role="img">
<title>Forward and inverse problem</title>
<desc>The model geometry and the physical parameters define the load; a finite-element solve by Newton's method along the load path gives the collapsed lung. Forward: the parameters are given, optionally the uniform pressure is searched for a target volume. Inverse: the parameters marked fit are updated by bounded least squares on the two-way distance to the collapsed CT, with analytic sensitivities, until a stop criterion.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .s  { font-size: 11.5px; text-anchor: middle; dominant-baseline: central; }
  .c  { font-size: 11px; font-family: Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
  .h  { font-size: 13px; font-weight: 600; dominant-baseline: central; }
  .l  { font-size: 11.5px; dominant-baseline: central; fill: #52514e; }
  .m  { font-size: 13px; font-style: italic; font-family: 'Times New Roman', Times, serif; font-variant-numeric: lining-nums; dominant-baseline: central; }
  .k  { font-size: 10.5px; font-family: Menlo, Consolas, monospace; dominant-baseline: central; fill: #52514e; }
  .a  { fill: none; stroke: #898781; stroke-width: 1.5; }
  .grp { fill: none; stroke: #b4b2ab; stroke-width: 0.8; stroke-dasharray: 5 4; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185fa5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993c1d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="792" height="800" fill="#ffffff"/>

<rect x="20" y="20" width="350" height="78" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="195" y="33.5" class="t" fill="#712b13">Model geometry</text>
<text x="195" y="50.5" class="s" fill="#993c1d">inflated lung: tetrahedral mesh Ω<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan>, clamp Γ<tspan dy="4" font-size="72%">D</tspan><tspan dy="-4" font-size="1">​</tspan> at the hilum</text>
<text x="195" y="67.5" class="s" fill="#993c1d">chest wall as a smooth distance field φ̃, margin A</text>
<text x="195" y="84.5" class="c" fill="#993c1d">fem/setup/problem.npz</text>
<rect x="390" y="20" width="350" height="78" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text x="565" y="33.5" class="t" fill="#3c3489">Physical parameters θ</text>
<text x="565" y="50.5" class="s" fill="#534ab7">q<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> (or p<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan>, or volume ratio), E, ν, ρ̄, positions e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan> → e<tspan dy="4" font-size="72%">B</tspan><tspan dy="-4" font-size="1">​</tspan></text>
<text x="565" y="67.5" class="s" fill="#534ab7">each one given, or marked “fit”</text>
<text x="565" y="84.5" class="c" fill="#534ab7">physics</text>
<path d="M195 98 L195 114 L330 114 L330 128" class="a" marker-end="url(#arrow)"/>
<path d="M565 98 L565 114 L430 114 L430 128" class="a" marker-end="url(#arrow)"/>
<rect x="120" y="130" width="520" height="78" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text x="380" y="143.5" class="t" fill="#3c3489">Load</text>
<text x="380" y="160.5" class="s" fill="#534ab7">surface pressure  q(X) = q<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> + γ (h(X) − h̄),   γ = ρ̄ g / E,   h = −e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan> · X</text>
<text x="380" y="177.5" class="s" fill="#534ab7">body force  b = γ (e<tspan dy="4" font-size="72%">B</tspan><tspan dy="-4" font-size="1">​</tspan> − e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan>)  (only when the position changes)</text>
<text x="380" y="194.5" class="c" fill="#534ab7">collapse/load.py</text>
<line x1="380" y1="208" x2="380" y2="226" class="a" marker-end="url(#arrow)"/>
<rect x="20" y="228" width="720" height="186" rx="12" class="grp"/>
<text x="34" y="244" class="h" fill="#0c447c">Finite-element solve  R(U; θ) = 0   (PyTorch / Warp cores, P1 tetrahedra)</text>
<rect x="34" y="258" width="220" height="64" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
<text x="144" y="273" class="t" fill="#0c447c">Elasticity</text>
<text x="144" y="290" class="s" fill="#185fa5">compressible Neo-Hookean</text>
<text x="144" y="307" class="s" fill="#185fa5">∫ P(F) : ∇δu dV</text>
<rect x="270" y="258" width="220" height="64" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
<text x="380" y="273" class="t" fill="#0c447c">Pleural pressure</text>
<text x="380" y="290" class="s" fill="#185fa5">follows the surface (Nanson)</text>
<text x="380" y="307" class="s" fill="#185fa5">∫ q J F⁻ᵀN · δu dA</text>
<rect x="506" y="258" width="220" height="64" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
<text x="616" y="273" class="t" fill="#0c447c">Chest wall</text>
<text x="616" y="290" class="s" fill="#185fa5">penalty on the smooth field φ̃</text>
<text x="616" y="307" class="s" fill="#185fa5">exact tangent, inside Newton</text>
<rect x="34" y="336" width="340" height="64" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
<text x="204" y="351" class="t" fill="#0c447c">Newton's method</text>
<text x="204" y="368" class="s" fill="#185fa5">exact tangent K<tspan dy="4" font-size="72%">t</tspan><tspan dy="-4" font-size="1">​</tspan> = ∂R/∂U, sparse direct solver,</text>
<text x="204" y="385" class="s" fill="#185fa5">line search; ≤ 50 iterations</text>
<rect x="386" y="336" width="340" height="64" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
<text x="556" y="351" class="t" fill="#0c447c">Load path</text>
<text x="556" y="368" class="s" fill="#185fa5">load applied proportionally, λ: 0 → 1;</text>
<text x="556" y="385" class="s" fill="#185fa5">failed step halved, successful step doubled</text>
<line x1="380" y1="414" x2="380" y2="432" class="a" marker-end="url(#arrow)"/>
<rect x="240" y="434" width="280" height="50" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
<text x="380" y="450.5" class="t" fill="#633806">Simulated collapsed lung</text>
<text x="380" y="467.5" class="s" fill="#854f0b">x = X + u(θ),  volume V(θ)</text>
<path d="M240 459 L130 459 L130 506" class="a" marker-end="url(#arrow)"/>
<path d="M520 459 L560 459 L560 506" class="a" marker-end="url(#arrow)"/>
<rect x="20" y="508" width="230" height="200" rx="12" class="grp"/>
<text x="34" y="524" class="h" fill="#085041">Forward  (collapse)</text>
<rect x="34" y="540" width="202" height="64" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="135" y="555" class="t" fill="#085041">Parameters given</text>
<text x="135" y="572" class="s" fill="#0f6e56">q<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> or p<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan>: one solve</text>
<text x="135" y="589" class="s" fill="#0f6e56">no collapsed CT needed</text>
<rect x="34" y="618" width="202" height="76" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="135" y="630.5" class="t" fill="#085041">Volume ratio given</text>
<text x="135" y="647.5" class="s" fill="#0f6e56">search q<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> with V(q<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan>) / V<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> = r:</text>
<text x="135" y="664.5" class="s" fill="#0f6e56">secant steps in a bracket,</text>
<text x="135" y="681.5" class="s" fill="#0f6e56">3–6 solves</text>
<rect x="266" y="508" width="474" height="200" rx="12" class="grp"/>
<text x="280" y="524" class="h" fill="#085041">Inverse  (fit)  with the collapsed CT surface</text>
<rect x="280" y="540" width="220" height="76" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="390" y="552.5" class="t" fill="#085041">Distance, both directions</text>
<text x="390" y="569.5" class="s" fill="#0f6e56">simulated → target, along the</text>
<text x="390" y="586.5" class="s" fill="#0f6e56">target normal; target → simulated</text>
<text x="390" y="603.5" class="s" fill="#0f6e56">(clamped points left out)</text>
<rect x="514" y="540" width="212" height="76" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="620" y="552.5" class="t" fill="#085041">Sensitivities</text>
<text x="620" y="569.5" class="s" fill="#0f6e56">K<tspan dy="4" font-size="72%">t</tspan><tspan dy="-4" font-size="1">​</tspan> ∂U/∂θ = −∂R/∂θ</text>
<text x="620" y="586.5" class="s" fill="#0f6e56">one linear solve per parameter,</text>
<text x="620" y="603.5" class="s" fill="#0f6e56">exact with the smooth wall</text>
<rect x="280" y="630" width="220" height="64" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="390" y="645" class="t" fill="#085041">Bounded least squares</text>
<text x="390" y="662" class="s" fill="#0f6e56">trust region (TRF), parameters</text>
<text x="390" y="679" class="s" fill="#0f6e56">within their bounds</text>
<rect x="514" y="630" width="212" height="64" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="620" y="645" class="t" fill="#085041">Stop</text>
<text x="620" y="662" class="s" fill="#0f6e56">tolerances, plateau, target error</text>
<text x="620" y="679" class="s" fill="#0f6e56">2.5 mm, time budget</text>
<line x1="500" y1="578" x2="512" y2="578" class="a" marker-end="url(#arrow)"/>
<path d="M620 616 L620 622 L390 622 L390 628" class="a" marker-end="url(#arrow)"/>
<line x1="500" y1="662" x2="512" y2="662" class="a" marker-end="url(#arrow)"/>
<path d="M740 662 L764 662 L764 59 L742 59" class="a" marker-end="url(#arrow)"/>
<text x="778" y="360" class="l" fill="#52514e" text-anchor="middle" transform="rotate(-90 778 360)">next θ</text>
<line x1="726" y1="662" x2="740" y2="662" class="a"/>
<path d="M135 708 L135 724 L330 724 L330 738" class="a" marker-end="url(#arrow)"/>
<path d="M503 708 L503 724 L430 724 L430 738" class="a" marker-end="url(#arrow)"/>
<rect x="120" y="740" width="520" height="48" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
<text x="380" y="755.5" class="t" fill="#633806">Result</text>
<text x="380" y="772.5" class="s" fill="#854f0b">collapsed surface, E, p<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> = q<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> E, ν, collapse %, ASSD, wall penetration  →  runs/&lt;run_name&gt;/</text>
</svg>
