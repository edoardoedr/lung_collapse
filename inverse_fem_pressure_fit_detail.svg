<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 756" role="img">
<title>Inverse FEM detail</title>
<desc>fem_setup builds the clamp (hilum and vessel balls plus still points), aligns the target, clusters the pressure regions and meshes the volume; fem_fit then fits the regional follower pressures coarse to fine with least squares and an analytic Jacobian, with an exchangeable FEM core (GetFEM, Warp, PyTorch).</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .s  { font-size: 11.5px; text-anchor: middle; dominant-baseline: central; }
  .c  { font-size: 11px; font-family: Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
  .h  { font-size: 13px; font-weight: 600; dominant-baseline: central; }
  .l  { font-size: 11.5px; dominant-baseline: central; fill: #52514e; }
  .a  { fill: none; stroke: #898781; stroke-width: 1.5; }
  .grp { fill: none; stroke: #b4b2ab; stroke-width: 0.8; stroke-dasharray: 5 4; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="756" fill="#ffffff"/>
<rect x="30" y="24" width="146" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="103" y="41.5" class="t" fill="#444441">Reference</text>
<text x="103" y="58.5" class="s" fill="#5f5e5a">registered inflated mesh</text>
<line x1="103" y1="76" x2="103" y2="104" class="a" marker-end="url(#arrow)"/>
<rect x="188" y="24" width="146" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="261" y="41.5" class="t" fill="#444441">Target</text>
<text x="261" y="58.5" class="s" fill="#5f5e5a">collapsed mesh</text>
<line x1="261" y1="76" x2="261" y2="104" class="a" marker-end="url(#arrow)"/>
<rect x="346" y="24" width="146" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="419" y="41.5" class="t" fill="#444441">Anchor</text>
<text x="419" y="58.5" class="s" fill="#5f5e5a">hilum + vessel balls</text>
<line x1="419" y1="76" x2="419" y2="104" class="a" marker-end="url(#arrow)"/>
<rect x="504" y="24" width="146" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="577" y="41.5" class="t" fill="#444441">Wall (optional)</text>
<text x="577" y="58.5" class="s" fill="#5f5e5a">inflated surface +5 mm</text>
<line x1="577" y1="76" x2="577" y2="104" class="a" marker-end="url(#arrow)"/>
<rect x="20" y="106" width="640" height="186" rx="12" class="grp"/>
<text x="34" y="122" class="h" fill="#712b13">fem_setup — no FEM library, seconds</text>
<rect x="34" y="136" width="196" height="62" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="132" y="150" class="t" fill="#712b13">Clamp, u = 0</text>
<text x="132" y="167" class="s" fill="#993c1d">union of the anchor balls</text>
<text x="132" y="184" class="c" fill="#993c1d">anchor_point</text>
<rect x="242" y="136" width="196" height="62" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="340" y="150" class="t" fill="#712b13">Target alignment</text>
<text x="340" y="167" class="s" fill="#993c1d">rigid, on the clamped points</text>
<text x="340" y="184" class="c" fill="#993c1d">align: hilum_rigid</text>
<rect x="450" y="136" width="196" height="62" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="548" y="150" class="t" fill="#712b13">Still points clamped</text>
<text x="548" y="167" class="s" fill="#993c1d">barely moving (&lt; 5 mm)</text>
<text x="548" y="184" class="c" fill="#993c1d">clamp_still_mm</text>
<line x1="230" y1="167" x2="240" y2="167" class="a" marker-end="url(#arrow)"/>
<line x1="438" y1="167" x2="448" y2="167" class="a" marker-end="url(#arrow)"/>
<rect x="34" y="214" width="300" height="62" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="184" y="228" class="t" fill="#712b13">Pressure regions</text>
<text x="184" y="245" class="s" fill="#993c1d">Ward clustering of the normal displacement</text>
<text x="184" y="262" class="c" fill="#993c1d">levels K = 1, 4, 8, 14, 25, 40</text>
<rect x="346" y="214" width="300" height="62" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="496" y="228" class="t" fill="#712b13">Volume mesh → problem.npz</text>
<text x="496" y="245" class="s" fill="#993c1d">Gmsh tetrahedra, surface nodes kept</text>
<text x="496" y="262" class="c" fill="#993c1d">mesh_size_mm 14</text>
<line x1="340" y1="292" x2="340" y2="318" class="a" marker-end="url(#arrow)"/>
<rect x="20" y="320" width="640" height="338" rx="12" class="grp"/>
<text x="34" y="336" class="h" fill="#712b13">fem_fit — coarse-to-fine, each level warm-started from the best so far</text>
<rect x="34" y="352" width="196" height="92" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="132" y="372.5" class="t" fill="#712b13">Forward solve</text>
<text x="132" y="389.5" class="s" fill="#993c1d">Neo-Hookean, E = 1, ν = 0.40</text>
<text x="132" y="406.5" class="s" fill="#993c1d">follower pressure, Newton</text>
<text x="132" y="423.5" class="c" fill="#993c1d">q = p/E per region</text>
<rect x="242" y="352" width="196" height="92" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="340" y="372.5" class="t" fill="#712b13">Residual</text>
<text x="340" y="389.5" class="s" fill="#993c1d">fitted − target, free points</text>
<text x="340" y="406.5" class="s" fill="#993c1d">+ smoothness of q</text>
<text x="340" y="423.5" class="c" fill="#993c1d">loss: point | plane</text>
<rect x="450" y="352" width="196" height="92" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="548" y="372.5" class="t" fill="#712b13">Least squares (TRF)</text>
<text x="548" y="389.5" class="s" fill="#993c1d">analytic Jacobian:</text>
<text x="548" y="406.5" class="s" fill="#993c1d">1 linear solve / iteration</text>
<text x="548" y="423.5" class="c" fill="#993c1d">K_t dU/dq = dR/dq</text>
<line x1="230" y1="398" x2="240" y2="398" class="a" marker-end="url(#arrow)"/>
<line x1="438" y1="398" x2="448" y2="398" class="a" marker-end="url(#arrow)"/>
<path d="M548 444 L548 462 L132 462 L132 446" class="a" marker-end="url(#arrow)"/>
<text x="340" y="474" class="s" fill="#52514e">new pressures q per region (bounded)</text>
<rect x="34" y="490" width="300" height="70" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="184" y="508" class="t" fill="#712b13">With the wall</text>
<text x="184" y="525" class="s" fill="#993c1d">penalty contact (nodal rule), outer rounds,</text>
<text x="184" y="542" class="s" fill="#993c1d">adaptive load steps, fail fast</text>
<rect x="346" y="490" width="300" height="70" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="496" y="508" class="t" fill="#712b13">Stops</text>
<text x="496" y="525" class="s" fill="#993c1d">level / fit plateau, target error, time budget;</text>
<text x="496" y="542" class="s" fill="#993c1d">best result checkpointed, watchdog</text>
<rect x="34" y="574" width="198" height="52" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="133" y="591.5" class="t" fill="#712b13">GetFEM</text>
<text x="133" y="608.5" class="s" fill="#993c1d">reference, CPU</text>
<rect x="240" y="574" width="198" height="52" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="339" y="591.5" class="t" fill="#712b13">Warp</text>
<text x="339" y="608.5" class="s" fill="#993c1d">GPU kernels</text>
<rect x="446" y="574" width="198" height="52" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="545" y="591.5" class="t" fill="#712b13">PyTorch</text>
<text x="545" y="608.5" class="s" fill="#993c1d">autodiff, any material</text>
<text x="340" y="642" class="l" text-anchor="middle">exchangeable cores (solver); Warp and PyTorch share nodal.py, identical fits</text>
<line x1="340" y1="660" x2="340" y2="684" class="a" marker-end="url(#arrow)"/>
<rect x="34" y="686" width="198" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="133" y="703.5" class="t" fill="#444441">lung_fem_fit_*.vtp</text>
<text x="133" y="720.5" class="s" fill="#5f5e5a">errors, pressure, clamp</text>
<rect x="240" y="686" width="198" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="339" y="703.5" class="t" fill="#444441">result_summary.json</text>
<text x="339" y="720.5" class="s" fill="#5f5e5a">errors, pressures, rotation</text>
<rect x="446" y="686" width="198" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="545" y="703.5" class="t" fill="#444441">fem/&lt;run_name&gt;/</text>
<text x="545" y="720.5" class="s" fill="#5f5e5a">history.csv, best_state.npz</text>
</svg>
