<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 1016" role="img">
<title>Lung collapse pipeline</title>
<desc>Steps of the pipeline: segmentation in 3D Slicer, input check, CT density and emphysema, surface meshes, hilum anchor, model geometry (clamp, chest wall, volume mesh), then the physical model with its parameters given or fitted, run forward (collapse) or inverse (fit); results per run and the GNN surrogate they feed.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .s  { font-size: 11.5px; text-anchor: middle; dominant-baseline: central; }
  .c  { font-size: 11px; font-family: Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
  .h  { font-size: 13px; font-weight: 600; dominant-baseline: central; }
  .l  { font-size: 11.5px; dominant-baseline: central; fill: #52514e; }
  .m  { font-size: 13px; font-style: italic; font-family: 'Times New Roman', Times, serif; font-variant-numeric: lining-nums; dominant-baseline: central; }
  .k  { font-size: 10.5px; font-family: Menlo, Consolas, monospace; dominant-baseline: central; fill: #52514e; }
  .a  { fill: none; stroke: #898781; stroke-width: 1.5; }
  .grp { fill: none; stroke: #b4b2ab; stroke-width: 0.8; stroke-dasharray: 5 4; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185fa5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993c1d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="1016" fill="#ffffff"/>

<rect x="80" y="24" width="520" height="62" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="340" y="38" class="t" fill="#444441">Segmentation</text>
<text x="340" y="55" class="s" fill="#5f5e5a">inflated lung, airways, arteries, veins (+ collapsed lung, optional)</text>
<text x="340" y="72" class="c" fill="#5f5e5a">3D Slicer (manual)</text>
<line x1="340" y1="86" x2="340" y2="106" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="108" width="520" height="62" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="340" y="122" class="t" fill="#085041">Input check</text>
<text x="340" y="139" class="s" fill="#0f6e56">closed surfaces, same scan, containment, notches</text>
<text x="340" y="156" class="c" fill="#0f6e56">check_inputs  (needs the collapsed lung)</text>
<line x1="340" y1="170" x2="340" y2="190" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="192" width="520" height="79" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="340" y="206" class="t" fill="#085041">CT density and emphysema</text>
<text x="340" y="223" class="s" fill="#0f6e56">lung density (mass / volume), emphysema volume (LAA%−950);</text>
<text x="340" y="240" class="s" fill="#0f6e56">emphysema yes / no: read on the CT by the user</text>
<text x="340" y="257" class="c" fill="#0f6e56">scripts/ct_density.py  →  physics.ct_density, ct_emphysema</text>
<line x1="340" y1="271" x2="340" y2="291" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="293" width="520" height="62" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="340" y="307" class="t" fill="#085041">Surface meshes</text>
<text x="340" y="324" class="s" fill="#0f6e56">inflated lung = the model, collapsed lung = the target; ~480 nodes each (ACVD)</text>
<text x="340" y="341" class="c" fill="#0f6e56">geometry</text>
<line x1="340" y1="355" x2="340" y2="375" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="377" width="520" height="62" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="340" y="391" class="t" fill="#085041">Hilum anchor</text>
<text x="340" y="408" class="s" fill="#0f6e56">rings where airways and vessels enter the lung; hilum = their centroid</text>
<text x="340" y="425" class="c" fill="#0f6e56">hilum</text>
<line x1="340" y1="439" x2="340" y2="459" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="461" width="520" height="62" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="340" y="475" class="t" fill="#712b13">Model geometry</text>
<text x="340" y="492" class="s" fill="#993c1d">clamp at the hilum, chest wall as a smooth field, tetrahedral mesh</text>
<text x="340" y="509" class="c" fill="#993c1d">fem_setup  →  fem/setup/problem.npz</text>
<line x1="340" y1="523" x2="340" y2="543" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="545" width="520" height="112" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text x="340" y="558.5" class="t" fill="#3c3489">Physical model: parameters given or fitted</text>
<text x="340" y="575.5" class="s" fill="#534ab7">stiffness E, compressibility ν, density ρ̄, patient position (CT → collapse),</text>
<text x="340" y="592.5" class="s" fill="#534ab7">uniform pressure q₀ = p₀ / E, or the volume ratio to reach</text>
<text x="340" y="609.5" class="s" fill="#534ab7">pressure / E  =  q₀ + γ (h − h̄),   γ = ρ̄ g / E,   inside the chest wall</text>
<text x="340" y="626.5" class="s" fill="#534ab7">optional limit of compression J ≥ φ = tissue + trapped air (CT)</text>
<text x="340" y="643.5" class="c" fill="#534ab7">physics</text>
<path d="M240 657 L240 691" class="a" marker-end="url(#arrow)"/>
<path d="M440 657 L440 691" class="a" marker-end="url(#arrow)"/>
<rect x="60" y="693" width="270" height="96" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
<text x="195" y="707" class="t" fill="#0c447c">Forward</text>
<text x="195" y="724" class="s" fill="#185fa5">all parameters given: collapse %, or a</text>
<text x="195" y="741" class="s" fill="#185fa5">pressure (12 mmHg, with the barrier)</text>
<text x="195" y="758" class="s" fill="#185fa5">→ collapsed lung (no collapsed CT needed)</text>
<text x="195" y="775" class="c" fill="#185fa5">collapse</text>
<rect x="350" y="693" width="270" height="96" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.8"/>
<text x="485" y="707" class="t" fill="#0c447c">Inverse</text>
<text x="485" y="724" class="s" fill="#185fa5">parameters marked “fit” are found by least</text>
<text x="485" y="741" class="s" fill="#185fa5">squares on the distance to the collapsed CT</text>
<text x="485" y="758" class="s" fill="#185fa5">→ E, p₀, ν of the patient</text>
<text x="485" y="775" class="c" fill="#185fa5">fit</text>
<path d="M195 789 L195 809 L300 809 L300 825" class="a" marker-end="url(#arrow)"/>
<path d="M485 789 L485 809 L380 809 L380 825" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="827" width="520" height="80" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.8"/>
<text x="340" y="841.5" class="t" fill="#633806">Results of a run</text>
<text x="340" y="858.5" class="s" fill="#854f0b">collapsed surface, physical parameters, collapse %, errors, wall penetration</text>
<text x="340" y="875.5" class="s" fill="#854f0b">collapse sequence for 3D Slicer / ParaView</text>
<text x="340" y="892.5" class="c" fill="#854f0b">runs/&lt;run_name&gt;/  surface.vtp  summary.json  state.npz  sequence/</text>
<line x1="340" y1="907" x2="340" y2="927" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="929" width="520" height="62" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="340" y="951.5" class="t" fill="#444441">GNN surrogate (planned)</text>
<text x="340" y="968.5" class="s" fill="#5f5e5a">trained on forward runs: geometry + load → displacement; tested on the real collapses</text>
</svg>
