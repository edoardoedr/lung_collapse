<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 820" role="img">
<title>Collapsed lung pipeline</title>
<desc>Steps: segmentation in 3D Slicer, input check, surface meshing, hilum anchor, registration, FEM setup, FEM fit of regional pleural pressures, collapse sequence and visualisation in 3D Slicer. The code name under each step is the step name in the config (main.py) or the script that runs it.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .t  { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .s  { font-size: 11.5px; text-anchor: middle; dominant-baseline: central; }
  .c  { font-size: 11px; font-family: Menlo, Consolas, monospace; text-anchor: middle; dominant-baseline: central; }
  .h  { font-size: 13px; font-weight: 600; dominant-baseline: central; }
  .l  { font-size: 11.5px; dominant-baseline: central; fill: #52514e; }
  .a  { fill: none; stroke: #898781; stroke-width: 1.5; }
  .grp { fill: none; stroke: #b4b2ab; stroke-width: 0.8; stroke-dasharray: 5 4; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="820" fill="#ffffff"/>
<rect x="80" y="30" width="520" height="62" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="340" y="44" class="t" fill="#444441">1 · Segmentation</text>
<text x="340" y="61" class="s" fill="#5f5e5a">inflated + collapsed lung, airways, arteries, veins</text>
<text x="340" y="78" class="c" fill="#5f5e5a">3D Slicer (nnInteractive + manual)</text>
<line x1="340" y1="92" x2="340" y2="112" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="114" width="520" height="62" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="340" y="128" class="t" fill="#085041">1b · Input check</text>
<text x="340" y="145" class="s" fill="#0f6e56">closed surfaces, same scan, containment, notches</text>
<text x="340" y="162" class="c" fill="#0f6e56">check_inputs</text>
<line x1="340" y1="176" x2="340" y2="196" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="198" width="520" height="62" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="340" y="212" class="t" fill="#085041">2 · Surface meshing</text>
<text x="340" y="229" class="s" fill="#0f6e56">collapsed lung → ~480 nodes (ACVD remeshing)</text>
<text x="340" y="246" class="c" fill="#0f6e56">surface_mesh</text>
<line x1="340" y1="260" x2="340" y2="280" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="282" width="520" height="62" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="340" y="296" class="t" fill="#085041">3 · Hilum anchor</text>
<text x="340" y="313" class="s" fill="#0f6e56">rings where airways / vessels enter the lung → hilum</text>
<text x="340" y="330" class="c" fill="#0f6e56">hilum</text>
<line x1="340" y1="344" x2="340" y2="364" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="366" width="520" height="62" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="340" y="380" class="t" fill="#085041">4 · Registration</text>
<text x="340" y="397" class="s" fill="#0f6e56">elastix on the masks + hilum landmarks → inflated mesh, same nodes</text>
<text x="340" y="414" class="c" fill="#0f6e56">registration</text>
<line x1="340" y1="428" x2="340" y2="448" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="450" width="520" height="62" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="340" y="464" class="t" fill="#712b13">5a · FEM setup</text>
<text x="340" y="481" class="s" fill="#993c1d">clamp (hilum + vessels + still points), alignment, regions, tet mesh</text>
<text x="340" y="498" class="c" fill="#993c1d">fem_setup</text>
<line x1="340" y1="512" x2="340" y2="532" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="534" width="520" height="62" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="340" y="548" class="t" fill="#712b13">5b · FEM fit</text>
<text x="340" y="565" class="s" fill="#993c1d">regional pleural pressures, coarse-to-fine; GetFEM / Warp / PyTorch</text>
<text x="340" y="582" class="c" fill="#993c1d">fem_fit</text>
<line x1="340" y1="596" x2="340" y2="616" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="618" width="520" height="62" rx="8" fill="#e6effa" stroke="#2f5f9e" stroke-width="0.8"/>
<text x="340" y="632" class="t" fill="#1f4374">6 · Collapse sequence</text>
<text x="340" y="649" class="s" fill="#2f5f9e">FEM re-solved with the fitted pressures ramped 0 → 100 %</text>
<text x="340" y="666" class="c" fill="#2f5f9e">scripts/collapse_sequence.py</text>
<line x1="340" y1="680" x2="340" y2="700" class="a" marker-end="url(#arrow)"/>
<rect x="80" y="702" width="520" height="62" rx="8" fill="#e6effa" stroke="#2f5f9e" stroke-width="0.8"/>
<text x="340" y="716" class="t" fill="#1f4374">7 · Visualisation</text>
<text x="340" y="733" class="s" fill="#2f5f9e">3D Slicer (one sequence, or several side by side) / ParaView</text>
<text x="340" y="750" class="c" fill="#2f5f9e">load_collapse_in_slicer.py · slicer_compare_sequences.py</text>
<rect x="36" y="790" width="14" height="14" rx="3" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.8"/>
<text x="56" y="797" class="l">manual (3D Slicer)</text>
<rect x="196" y="790" width="14" height="14" rx="3" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.8"/>
<text x="216" y="797" class="l">pipeline step (main.py)</text>
<rect x="356" y="790" width="14" height="14" rx="3" fill="#faece7" stroke="#993c1d" stroke-width="0.8"/>
<text x="376" y="797" class="l">inverse FEM (main.py)</text>
<rect x="516" y="790" width="14" height="14" rx="3" fill="#e6effa" stroke="#2f5f9e" stroke-width="0.8"/>
<text x="536" y="797" class="l">separate script</text>
</svg>
