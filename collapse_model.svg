<text x="207" y="184" class="s" style="fill:#993c1d">inflated lung</text>
<text x="207" y="200" class="s" style="fill:#993c1d">stress-free reference Ω<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan></text>
<text x="207" y="216" class="s" style="fill:#993c1d">density ρ̄, stiffness E, ν</text>
<text x="30" y="62" class="l" style="fill:#185fa5">pleural under-pressure, larger at the top:</text>
<text x="30" y="77" class="m" style="fill:#185fa5">p<tspan dy="4" font-size="72%">atm</tspan><tspan dy="-4" font-size="1">​</tspan> − p<tspan dy="4" font-size="72%">pl</tspan><tspan dy="-4" font-size="1">​</tspan> = p<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> + ρ̄g (h − h̄)</text>
<text x="30" y="314" class="l">its gradient ρ̄g ≈ 2 Pa/mm carries the weight (Archimedes):</text>
<text x="30" y="333" class="m">−∮ p<tspan dy="4" font-size="72%">pl</tspan><tspan dy="-4" font-size="1">​</tspan> n dA = ρ̄ g V e<tspan dy="4" font-size="72%">h</tspan><tspan dy="-4" font-size="1">​</tspan>,   e<tspan dy="4" font-size="72%">h</tspan><tspan dy="-4" font-size="1">​</tspan> = −e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan></text>
<line x1="350" y1="150" x2="350" y2="250" class="a" marker-end="url(#ag)" style="stroke:#993c1d;stroke-width:2"/>
<text x="350" y="262" class="m" style="fill:#993c1d" text-anchor="middle">g</text>
<text x="350" y="278" class="m" style="fill:#993c1d" text-anchor="middle">e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan></text>
<line x1="330" y1="250" x2="330" y2="150" class="a" marker-end="url(#ak)" style="stroke:#444441"/>
<text x="330" y="139" class="m" style="fill:#444441" text-anchor="middle">h</text>
<text x="332" y="123" class="k" text-anchor="middle">anterior</text>
<text x="310" y="296" class="k" text-anchor="middle">posterior</text>
<rect x="390" y="20" width="350" height="330" rx="12" class="grp"/>
<text x="404" y="38" class="h" style="fill:#444441">Pneumothorax: load and collapsed lung</text>
<ellipse cx="555" cy="200" rx="112" ry="84" fill="none" stroke="#5f5e5a" stroke-width="1.2" stroke-dasharray="6 4"/>
<ellipse cx="521" cy="227" rx="76" ry="56" fill="#f6ddd5" stroke="#993c1d" stroke-width="1.2"/>
