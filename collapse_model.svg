</g>
<line x1="384" y1="562" x2="496" y2="562" stroke="#5f5e5a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="504" y1="506" x2="504" y2="552" class="a" marker-end="url(#ag)" style="stroke:#993c1d;stroke-width:2"/>
<text x="513" y="528" class="m" style="fill:#993c1d">g</text>
<text x="440" y="577" class="s" style="fill:#444441">prone</text>
<text x="440" y="592" class="k" text-anchor="middle">e = −y (anterior)</text>
<circle cx="540" cy="482" r="4.5" fill="#5f5e5a"/>
<text x="550" y="482" class="k">spine (posterior)</text>
<text x="532" y="506" class="l" style="fill:#444441">same position (e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan> = e<tspan dy="4" font-size="72%">B</tspan><tspan dy="-4" font-size="1">​</tspan>):</text>
<text x="532" y="522" class="l">surface load only</text>
<text x="532" y="546" class="l" style="fill:#444441">different positions: + body force</text>
<text x="532" y="564" class="m" style="fill:#993c1d">b = ρ̄ g (e<tspan dy="4" font-size="72%">B</tspan><tspan dy="-4" font-size="1">​</tspan> − e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan>)</text>
<text x="532" y="582" class="l">resultant = weight along e<tspan dy="4" font-size="72%">B</tspan><tspan dy="-4" font-size="1">​</tspan></text>
<rect x="20" y="620" width="720" height="242" rx="12" class="grp"/>
<text x="34" y="638" class="h" style="fill:#444441">Parameters: each one given (a number) or fitted to the collapsed CT</text>
<text x="34" y="660" class="l" style="fill:#444441" style="font-weight:600">symbol</text>
<text x="110" y="660" class="l" style="fill:#444441" style="font-weight:600">meaning</text>
<text x="392" y="660" class="l" style="fill:#444441" style="font-weight:600">config key</text>
<text x="566" y="660" class="l" style="fill:#444441" style="font-weight:600">default</text>
<line x1="34" y1="670" x2="726" y2="670" stroke="#b4b2ab" stroke-width="0.8"/>
<text x="34" y="684" class="m" style="fill:#3c3489">q<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> = p<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> / E</text>
<text x="110" y="684" class="l">uniform pressure released: sets the collapse %</text>
<text x="392" y="684" class="k">physics.collapse</text>
<text x="566" y="684" class="l">fitted, start 0.3</text>
<text x="34" y="704" class="m" style="fill:#3c3489">E</text>
<text x="110" y="704" class="l">effective stiffness of the lung tissue</text>
<text x="392" y="704" class="k">physics.E_Pa</text>
<text x="566" y="704" class="l">1360 Pa, or E(collapse %)</text>
<text x="34" y="724" class="m" style="fill:#3c3489">ν</text>
<text x="110" y="724" class="l">compressibility (the lung loses air)</text>
<text x="392" y="724" class="k">physics.material.nu</text>
<text x="566" y="724" class="l">0.30</text>
<text x="34" y="744" class="m" style="fill:#3c3489">ρ̄</text>
<text x="110" y="744" class="l">mean density of the inflated lung (model)</text>
<text x="392" y="744" class="k">physics.tissue_density</text>
<text x="566" y="744" class="l">200 kg/m³ (ρ̄g 1.96 Pa/mm)</text>
<text x="34" y="764" class="m" style="fill:#3c3489">ρ̄<tspan dy="4" font-size="72%">CT</tspan><tspan dy="-4" font-size="1">​</tspan></text>
<text x="110" y="764" class="l">the same measured on the CT (report only)</text>
<text x="392" y="764" class="k">physics.ct_density</text>
<text x="566" y="764" class="l">per patient, median 163 kg/m³</text>
<text x="34" y="784" class="m" style="fill:#3c3489">e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan>, e<tspan dy="4" font-size="72%">B</tspan><tspan dy="-4" font-size="1">​</tspan></text>
<text x="110" y="784" class="l">patient position: reference CT, collapse</text>
<text x="392" y="784" class="k">physics.gravity</text>
<text x="566" y="784" class="l">supine, supine</text>
<text x="34" y="804" class="m" style="fill:#3c3489">A, σ</text>
<text x="110" y="804" class="l">chest wall: margin, smoothing of the field</text>
<text x="392" y="804" class="k">fem_setup.wall</text>
<text x="566" y="804" class="l">5 mm, 3 mm</text>
<text x="34" y="824" class="m" style="fill:#3c3489">k</text>
<text x="110" y="824" class="l">chest wall: penalty stiffness</text>
<text x="392" y="824" class="k">physics.wall</text>
<text x="566" y="824" class="l">20 E/mm</text>
<text x="34" y="846" class="l" style="fill:#3c3489">E rule (12 fitted patients, ν 0.30, ρ̄ 200 kg/m³):  log<tspan dy="4" font-size="72%">10</tspan><tspan dy="-4" font-size="1">​</tspan> E [Pa] = 3.53 − 0.0135 × collapse %   →  ≈ 1.6 kPa at 25 %, 0.73 kPa at 50 %</text>
</svg>
