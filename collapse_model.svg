<text x="400" y="62" class="l" style="fill:#185fa5">load = the pleural pressure that is lost, on the free surface:</text>
<text x="400" y="77" class="m" style="fill:#185fa5">Δp(X) = p<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> + ρ̄g (h(X) − h̄)</text>
<text x="400" y="315" class="l" style="fill:#854f0b">chest wall (dashed): margin A, rigid, frictionless;</text>
<text x="400" y="330" class="l" style="fill:#854f0b">solid brown: contact, the wall now carries the weight</text>
<text x="562" y="296" class="l" style="fill:#854f0b">contact</text>
<text x="617" y="166" class="s" style="fill:#5f5e5a">air at p<tspan dy="4" font-size="72%">atm</tspan><tspan dy="-4" font-size="1">​</tspan></text>
<rect x="20" y="364" width="720" height="62" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.8"/>
<text x="380" y="381" class="t" style="fill:#3c3489">Non-dimensional load (only ratios to E matter for the shape)</text>
<text x="380" y="407" class="m" style="fill:#3c3489" text-anchor="middle" style="font-size:15px">q(X) = Δp / E = q<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> + γ (h(X) − h̄),  q<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> = p<tspan dy="4" font-size="72%">0</tspan><tspan dy="-4" font-size="1">​</tspan> / E,  γ = ρ̄ g / E,  h = −e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan> · X</text>
<rect x="20" y="440" width="720" height="166" rx="12" class="grp"/>
<text x="34" y="458" class="h" style="fill:#444441">Patient position: gravity e<tspan dy="4" font-size="72%">A</tspan><tspan dy="-4" font-size="1">​</tspan> in the inflated CT, e<tspan dy="4" font-size="72%">B</tspan><tspan dy="-4" font-size="1">​</tspan> during the collapse (LPS axes)</text>
<g transform="translate(100 533) rotate(0)">
<ellipse cx="0" cy="0" rx="44" ry="27" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
