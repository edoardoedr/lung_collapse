<text x="100" y="577" class="s" style="fill:#444441">supine</text>
<text x="100" y="592" class="k" text-anchor="middle">e = +y (posterior)</text>
<g transform="translate(270 516) rotate(90)">
<ellipse cx="0" cy="0" rx="44" ry="27" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
