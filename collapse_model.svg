<text x="525" y="219" class="s" style="fill:#993c1d">collapsed lung</text>
<text x="398" y="252" class="l" style="fill:#444441">hilum</text>
<text x="398" y="267" class="m" style="fill:#444441">u = 0</text>
<text x="525" y="236" class="m" style="fill:#993c1d" text-anchor="middle">x = X + u</text>
<line x1="633.229" y1="290.709" x2="628.488" y2="282.007" class="a" marker-end="url(#ap)" style="stroke:#185fa5"/>
