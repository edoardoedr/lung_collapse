<text x="270" y="577" class="s" style="fill:#444441">left lateral decubitus</text>
<text x="270" y="592" class="k" text-anchor="middle">e = +x (left)</text>
<g transform="translate(440 533) rotate(180)">
<ellipse cx="0" cy="0" rx="44" ry="27" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
